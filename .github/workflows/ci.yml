# CI 워크플로: 서버 vitest, 모바일 node --test, 웹 lint/build를 push·PR마다 실행한다.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 버전은 package.json의 packageManager에서 읽는다.
      # 여기서 version을 함께 지정하면 ERR_PNPM_BAD_PM_VERSION으로 설정 단계가 실패한다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # server/intake/media.ts의 정제 경로와 해당 테스트는 ffmpeg/ffprobe를 실제로 실행한다.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm test
      - run: pnpm test:mobile
      - run: pnpm build
      - run: pnpm --dir mobile install --frozen-lockfile
      - run: pnpm --dir mobile typecheck
