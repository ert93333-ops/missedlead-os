# Keep-alive ping: prevents the free Supabase project from auto-pausing
# (7 days idle) and warms the free Render service. Runs every 6 hours —
# ~120 workflow runs/month, within the private-repo free minutes.
# Required repo variables (Settings > Secrets and variables > Actions > Variables):
#   PUBLIC_APP_URL       e.g. https://wecover.onrender.com
#   PUBLIC_SUPABASE_URL  e.g. https://<ref>.supabase.co
name: keepalive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app + Supabase
        run: |
          curl -fsS --max-time 60 -o /dev/null "${{ vars.PUBLIC_APP_URL }}/api/capabilities" || true
          curl -fsS --max-time 60 -o /dev/null "${{ vars.PUBLIC_SUPABASE_URL }}/auth/v1/health" || true
