# CI 워크플로: 서버 vitest, 모바일 node --test, 웹 lint/build를 push·PR마다 실행한다.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:mobile
      - run: pnpm build
      - run: pnpm --dir mobile install --frozen-lockfile
      - run: pnpm --dir mobile typecheck
